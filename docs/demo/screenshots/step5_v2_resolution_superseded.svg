<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .text-main { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .text-muted { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .text-white { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .success-card { fill: rgba(46, 160, 67, 0.08); stroke: #2ea043; stroke-width: 1.5; }
      .badge-green { fill: rgba(46, 160, 67, 0.15); stroke: #2ea043; stroke-width: 1; }
      .badge-gray { fill: rgba(139, 148, 158, 0.15); stroke: #8b949e; stroke-width: 1; }
      .code-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1280" height="800" class="bg" />

  <!-- App Header -->
  <rect x="0" y="0" width="1280" height="60" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="36" cy="30" r="14" fill="#1f6feb" />
  <path d="M 30 30 L 34 34 L 42 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="60" y="35" class="text-white" font-size="16" font-weight="600">PRISM: Open Source Security Transition Monitor</text>

  <!-- Stepper Navigation -->
  <rect x="40" y="80" width="1200" height="65" rx="8" class="card-bg" />
  <rect x="55" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="142" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 1. Ingestion</text>
  <rect x="245" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="332" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 2. Tri-State Claims</text>
  <rect x="435" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="522" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 3. V1 Failure</text>
  <rect x="625" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="712" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 4. Engineering Fix</text>
  <!-- Step 5 (Active) -->
  <rect x="815" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="902" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 5. V2 Resolution</text>
  <rect x="1005" y="92" width="220" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="1115" y="117" class="text-muted" font-size="12" text-anchor="middle">6. Measured Benchmark</text>

  <!-- Step 5 Content Container -->
  <rect x="40" y="165" width="1200" height="580" rx="8" class="card-bg" />
  <text x="70" y="200" class="text-white" font-size="18" font-weight="600">Step 5: V2 Corrected Evaluation on the Identical Scenario</text>
  <text x="70" y="222" class="text-muted" font-size="13">Under identical empirical inputs, V2 applies temporal provenance to resolve the claim as VERIFIED while preserving the historical record.</text>

  <!-- Side-by-Side Resolution Cards -->
  <!-- Left Side: Active Observation T1 (Current & Binding) -->
  <g transform="translate(70, 250)">
    <rect x="0" y="0" width="550" height="400" rx="6" class="success-card" />
    <rect x="20" y="20" width="180" height="26" rx="13" class="badge-green" />
    <text x="110" y="37" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">✓ BINDING EVIDENCE (T1)</text>

    <text x="20" y="75" class="text-white" font-size="14" font-weight="600">Live Probe: 2026-09-18 04:32:15Z (Post-Remediation)</text>
    <text x="20" y="95" class="text-muted" font-size="12">Source: HTTPS Response Header: Strict-Transport-Security</text>

    <!-- Code Box -->
    <rect x="20" y="110" width="510" height="110" rx="4" class="code-bg" />
    <text x="35" y="135" fill="#7ee787" font-size="12" font-family="monospace">HTTP/1.1 200 OK</text>
    <text x="35" y="160" fill="#7ee787" font-size="12" font-family="monospace" font-weight="bold">strict-transport-security: max-age=31536000; includeSubDomains; preload</text>
    <text x="35" y="185" fill="#8b949e" font-size="12" font-family="monospace">server: nginx/1.24.0</text>
    <text x="35" y="205" fill="#58a6ff" font-size="11" font-family="monospace">SHA-256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>

    <text x="20" y="245" class="text-white" font-size="13" font-weight="600">V2 Evaluator Decision:</text>
    <rect x="20" y="258" width="130" height="30" rx="15" fill="#238636" />
    <text x="85" y="278" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">VERIFIED</text>
    <text x="165" y="278" fill="#3fb950" font-size="13" font-weight="600">✓ Remediation correctly confirmed</text>

    <text x="20" y="320" class="text-muted" font-size="12">Verification Reason:</text>
    <text x="20" y="340" class="text-main" font-size="12">Empirical observation matches required threshold (max-age &gt;= 31536000).</text>
    <text x="20" y="360" class="text-main" font-size="12">Supersedes 1 older historical snapshot.</text>
  </g>

  <!-- Right Side: Historical Observation T0 (Audit Trail: Superseded) -->
  <g transform="translate(660, 250)">
    <rect x="0" y="0" width="550" height="400" rx="6" class="card-bg" />
    <rect x="20" y="20" width="190" height="26" rx="13" class="badge-gray" />
    <text x="115" y="37" fill="#8b949e" font-size="12" font-weight="bold" text-anchor="middle">⏸ SUPERSEDED AUDIT RECORD</text>

    <text x="20" y="75" class="text-white" font-size="14" font-weight="600">Historical Probe: 2026-09-17 10:00:00Z (T0)</text>
    <text x="20" y="95" class="text-muted" font-size="12">Status: Pre-remediation failing snapshot retained for audit transparency</text>

    <!-- Code Box -->
    <rect x="20" y="110" width="510" height="110" rx="4" class="code-bg" />
    <text x="35" y="135" fill="#8b949e" font-size="12" font-family="monospace">HTTP/1.1 200 OK</text>
    <text x="35" y="160" fill="#f85149" font-size="12" font-family="monospace"># Strict-Transport-Security header missing</text>
    <text x="35" y="185" fill="#8b949e" font-size="12" font-family="monospace">server: nginx/1.22.1</text>
    <text x="35" y="205" fill="#8b949e" font-size="11" font-family="monospace">SHA-256: 7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b</text>

    <text x="20" y="245" class="text-white" font-size="13" font-weight="600">Audit Trail Disposition:</text>
    <rect x="20" y="258" width="120" height="30" rx="15" class="badge-gray" />
    <text x="80" y="278" fill="#c9d1d9" font-size="12" font-weight="bold" text-anchor="middle">SUPERSEDED</text>
    <text x="155" y="278" class="text-muted" font-size="12">Replaced by timestamp 2026-09-18T04:32:15Z</text>

    <text x="20" y="320" class="text-white" font-size="12" font-weight="600">Integrity Guarantee:</text>
    <text x="20" y="340" class="text-muted" font-size="12">Historical failures are never deleted from tamper-evident logs;</text>
    <text x="20" y="360" class="text-muted" font-size="12">temporal ranking cleanly differentiates historical baseline from present posture.</text>
  </g>

  <!-- Bottom CTA -->
  <rect x="980" y="680" width="230" height="42" rx="6" fill="#1f6feb" />
  <text x="1095" y="706" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Next Step: Measured Benchmark →</text>
</svg>
