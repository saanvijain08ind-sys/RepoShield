<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .text-main { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .text-muted { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .text-white { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .code-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .diff-del { fill: rgba(248, 81, 73, 0.15); stroke: #f85149; stroke-width: 1; }
      .diff-add { fill: rgba(46, 160, 67, 0.15); stroke: #2ea043; stroke-width: 1; }
      .badge-blue { fill: rgba(56, 139, 253, 0.15); stroke: #388bfd; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1280" height="800" class="bg" />

  <!-- App Header -->
  <rect x="0" y="0" width="1280" height="60" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="36" cy="30" r="14" fill="#1f6feb" />
  <path d="M 30 30 L 34 34 L 42 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="60" y="35" class="text-white" font-size="16" font-weight="600">PRISM: Open Source Security Transition Monitor</text>

  <!-- Stepper Navigation -->
  <rect x="40" y="80" width="1200" height="65" rx="8" class="card-bg" />
  <rect x="55" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="142" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 1. Ingestion</text>
  <rect x="245" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="332" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 2. Tri-State Claims</text>
  <rect x="435" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="522" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 3. V1 Failure</text>
  <!-- Step 4 (Active) -->
  <rect x="625" y="92" width="175" height="40" rx="6" fill="#1f6feb" />
  <text x="712" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">4. Engineering Fix</text>
  <rect x="815" y="92" width="175" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="902" y="117" class="text-muted" font-size="12" text-anchor="middle">5. V2 Resolution</text>
  <rect x="1005" y="92" width="220" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="1115" y="117" class="text-muted" font-size="12" text-anchor="middle">6. Measured Benchmark</text>

  <!-- Step 4 Content Container -->
  <rect x="40" y="165" width="1200" height="580" rx="8" class="card-bg" />
  <text x="70" y="200" class="text-white" font-size="18" font-weight="600">Step 4: Inspect The Exact Engineering Fix (V1 → V2 Architecture)</text>
  <text x="70" y="222" class="text-muted" font-size="13">Two architectural changes: Temporal provenance ordering and graceful neutral-telemetry fallback.</text>

  <!-- Split Comparison View: V1 vs V2 Code Diff -->
  <!-- Left Side: Legacy V1 Logic (Flawed) -->
  <g transform="translate(70, 245)">
    <rect x="0" y="0" width="550" height="415" rx="6" class="card-bg" />
    <rect x="15" y="15" width="220" height="26" rx="13" class="diff-del" />
    <text x="125" y="32" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">❌ Legacy V1 Engine Logic</text>

    <text x="15" y="65" class="text-white" font-size="13" font-weight="600">server/services/verificationEngineV1.ts</text>
    <text x="15" y="85" class="text-muted" font-size="11">Flaw: Flat iteration; any past failure poisons verdict.</text>

    <!-- Code Block -->
    <rect x="15" y="98" width="520" height="295" rx="4" class="code-bg" />
    <text x="30" y="125" fill="#8b949e" font-size="11" font-family="monospace">// V1: Iterates in arbitrary order without timestamps</text>
    <text x="30" y="145" fill="#c9d1d9" font-size="11" font-family="monospace">for (const evidence of candidateEvidence) {</text>
    <text x="30" y="165" fill="#f85149" font-size="11" font-family="monospace">  // Flaw 1: No temporal ordering</text>
    <text x="30" y="185" fill="#f85149" font-size="11" font-family="monospace">  if (isFailingObservation(evidence, claim)) {</text>
    <text x="30" y="205" fill="#f85149" font-size="11" font-family="monospace">    // Permanent failure trap: ignores subsequent fix</text>
    <text x="30" y="225" fill="#f85149" font-size="11" font-family="monospace">    return {</text>
    <text x="30" y="245" fill="#f85149" font-size="11" font-family="monospace">      status: 'CONTRADICTED',</text>
    <text x="30" y="265" fill="#f85149" font-size="11" font-family="monospace">      reason: 'Historical failure detected'</text>
    <text x="30" y="285" fill="#f85149" font-size="11" font-family="monospace">    };</text>
    <text x="30" y="305" fill="#f85149" font-size="11" font-family="monospace">  }</text>
    <text x="30" y="325" fill="#8b949e" font-size="11" font-family="monospace">  // Flaw 2: Missing observations default to CONTRADICTION</text>
    <text x="30" y="345" fill="#f85149" font-size="11" font-family="monospace">  if (!hasEvidence) return { status: 'CONTRADICTED' };</text>
    <text x="30" y="365" fill="#c9d1d9" font-size="11" font-family="monospace">}</text>
  </g>

  <!-- Right Side: Corrected V2 Logic (Engineered) -->
  <g transform="translate(660, 245)">
    <rect x="0" y="0" width="550" height="415" rx="6" class="card-bg" />
    <rect x="15" y="15" width="230" height="26" rx="13" class="diff-add" />
    <text x="130" y="32" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">✓ Corrected V2 Engine Logic</text>

    <text x="15" y="65" class="text-white" font-size="13" font-weight="600">server/services/verificationEngineV2.ts</text>
    <text x="15" y="85" class="text-muted" font-size="11">Fix: Temporal sorting &amp; neutral telemetry handling.</text>

    <!-- Code Block -->
    <rect x="15" y="98" width="520" height="295" rx="4" class="code-bg" />
    <text x="30" y="125" fill="#7ee787" font-size="11" font-family="monospace">// FIX 1: Sort observations by collection time descending</text>
    <text x="30" y="145" fill="#7ee787" font-size="11" font-family="monospace">const sorted = [...candidates].sort((a, b) =&gt;</text>
    <text x="30" y="165" fill="#7ee787" font-size="11" font-family="monospace">  new Date(b.collectedAt).getTime() - new Date(a.collectedAt).getTime()</text>
    <text x="30" y="185" fill="#7ee787" font-size="11" font-family="monospace">);</text>
    <text x="30" y="210" fill="#7ee787" font-size="11" font-family="monospace">// Latest observation determines active ground truth</text>
    <text x="30" y="230" fill="#c9d1d9" font-size="11" font-family="monospace">const latest = sorted[0];</text>
    <text x="30" y="250" fill="#7ee787" font-size="11" font-family="monospace">if (latest &amp;&amp; satisfiesRule(latest, claim)) {</text>
    <text x="30" y="270" fill="#7ee787" font-size="11" font-family="monospace">  return { status: 'VERIFIED', supersededCount: sorted.length - 1 };</text>
    <text x="30" y="290" fill="#7ee787" font-size="11" font-family="monospace">}</text>
    <text x="30" y="315" fill="#7ee787" font-size="11" font-family="monospace">// FIX 2: Graceful fallback when evidence is inconclusive</text>
    <text x="30" y="335" fill="#e3b341" font-size="11" font-family="monospace">if (candidates.length === 0 || !isConclusive(latest)) {</text>
    <text x="30" y="355" fill="#e3b341" font-size="11" font-family="monospace">  return { status: 'INSUFFICIENT_EVIDENCE' };</text>
    <text x="30" y="375" fill="#c9d1d9" font-size="11" font-family="monospace">}</text>
  </g>

  <!-- Bottom CTA -->
  <rect x="980" y="680" width="230" height="42" rx="6" fill="#1f6feb" />
  <text x="1095" y="706" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Next Step: See V2 Result →</text>
</svg>
