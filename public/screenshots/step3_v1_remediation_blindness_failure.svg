<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .text-main { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .text-muted { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .text-white { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .fail-card { fill: rgba(248, 81, 73, 0.08); stroke: #f85149; stroke-width: 1.5; }
      .badge-red { fill: rgba(248, 81, 73, 0.15); stroke: #f85149; stroke-width: 1; }
      .badge-green { fill: rgba(46, 160, 67, 0.15); stroke: #2ea043; stroke-width: 1; }
      .code-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1280" height="800" class="bg" />

  <!-- App Header -->
  <rect x="0" y="0" width="1280" height="60" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="36" cy="30" r="14" fill="#1f6feb" />
  <path d="M 30 30 L 34 34 L 42 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="60" y="35" class="text-white" font-size="16" font-weight="600">PRISM: Open Source Security Transition Monitor</text>

  <!-- Stepper Navigation -->
  <rect x="40" y="80" width="1200" height="65" rx="8" class="card-bg" />
  <rect x="55" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="142" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 1. Ingestion</text>
  <rect x="245" y="92" width="175" height="40" rx="6" fill="#238636" />
  <text x="332" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✓ 2. Tri-State Claims</text>
  <!-- Step 3 (Active) -->
  <rect x="435" y="92" width="175" height="40" rx="6" fill="#da3633" />
  <text x="522" y="117" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">⚠ 3. V1 Failure</text>
  <rect x="625" y="92" width="175" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="712" y="117" class="text-muted" font-size="12" text-anchor="middle">4. Engineering Fix</text>
  <rect x="815" y="92" width="175" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="902" y="117" class="text-muted" font-size="12" text-anchor="middle">5. V2 Resolution</text>
  <rect x="1005" y="92" width="220" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="1115" y="117" class="text-muted" font-size="12" text-anchor="middle">6. Measured Benchmark</text>

  <!-- Step 3 Content Container -->
  <rect x="40" y="165" width="1200" height="580" rx="8" class="card-bg" />
  <text x="70" y="200" class="text-white" font-size="18" font-weight="600">Step 3: Reproduce Known V1 PRISM Failure (Remediation Blindness)</text>
  <text x="70" y="222" class="text-muted" font-size="13">Legacy V1 engine ignores temporal timestamps. A stale pre-remediation probe overrides a fresh valid probe.</text>

  <!-- Scenario Breakdown Banner -->
  <rect x="70" y="245" width="1140" height="95" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="90" y="272" fill="#58a6ff" font-size="12" font-weight="bold">SCENARIO: scen_01_remediation_hsts (Post-Remediation Verification)</text>
  <text x="90" y="295" class="text-white" font-size="14" font-weight="500">Claim: "Website enforces Strict-Transport-Security with max-age=31536000"</text>
  <text x="90" y="320" class="text-muted" font-size="12">Target: https://superprompt-cli.dev | Expected Ground Truth: <tspan fill="#3fb950" font-weight="bold">VERIFIED</tspan> (Remediation deployed at T1)</text>

  <!-- Timeline Cards -->
  <!-- Probe 1 (T0, Stale) -->
  <g transform="translate(70, 360)">
    <rect x="0" y="0" width="360" height="240" rx="6" class="card-bg" />
    <rect x="15" y="15" width="140" height="22" rx="11" class="badge-red" />
    <text x="85" y="30" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">PROBE T0 (HISTORICAL)</text>
    <text x="15" y="62" class="text-white" font-size="13" font-weight="600">Initial Scan (Before Fix)</text>
    <text x="15" y="82" class="text-muted" font-size="11">Collected: 2026-09-17 10:00:00Z</text>
    
    <rect x="15" y="95" width="330" height="95" rx="4" class="code-bg" />
    <text x="25" y="120" fill="#c9d1d9" font-size="11" font-family="monospace">HTTP/1.1 200 OK</text>
    <text x="25" y="140" fill="#c9d1d9" font-size="11" font-family="monospace">Server: nginx</text>
    <text x="25" y="165" fill="#f85149" font-size="11" font-family="monospace" font-weight="bold"># Strict-Transport-Security: ABSENT</text>

    <text x="15" y="215" fill="#f85149" font-size="11">Status at T0: Failing pre-remediation baseline</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(450, 460)">
    <path d="M 0 10 L 30 10 M 20 0 L 30 10 L 20 20" stroke="#58a6ff" stroke-width="2.5" fill="none" />
    <text x="15" y="-10" fill="#58a6ff" font-size="11" text-anchor="middle">Remediated</text>
  </g>

  <!-- Probe 2 (T1, Fresh) -->
  <g transform="translate(500, 360)">
    <rect x="0" y="0" width="360" height="240" rx="6" class="card-bg" />
    <rect x="15" y="15" width="140" height="22" rx="11" class="badge-green" />
    <text x="85" y="30" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">PROBE T1 (CURRENT)</text>
    <text x="15" y="62" class="text-white" font-size="13" font-weight="600">Re-Scan (After Fix)</text>
    <text x="15" y="82" class="text-muted" font-size="11">Collected: 2026-09-18 04:32:15Z</text>
    
    <rect x="15" y="95" width="330" height="95" rx="4" class="code-bg" />
    <text x="25" y="120" fill="#c9d1d9" font-size="11" font-family="monospace">HTTP/1.1 200 OK</text>
    <text x="25" y="145" fill="#7ee787" font-size="11" font-family="monospace" font-weight="bold">strict-transport-security:</text>
    <text x="25" y="165" fill="#7ee787" font-size="11" font-family="monospace">  max-age=31536000; preload</text>

    <text x="15" y="215" fill="#3fb950" font-size="11">Status at T1: REMEDIATED (Expected: VERIFIED)</text>
  </g>

  <!-- Result Box: V1 Failure Card -->
  <g transform="translate(880, 360)">
    <rect x="0" y="0" width="330" height="240" rx="6" class="fail-card" />
    <text x="20" y="32" fill="#f85149" font-size="14" font-weight="bold">❌ V1 ENGINE OUTCOME</text>
    
    <rect x="20" y="50" width="130" height="26" rx="13" class="badge-red" />
    <text x="85" y="68" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">CONTRADICTED</text>
    <text x="160" y="68" fill="#f85149" font-size="12" font-weight="bold">(FAILURE)</text>

    <text x="20" y="105" class="text-white" font-size="12" font-weight="600">Root Cause Mechanism:</text>
    <text x="20" y="125" class="text-muted" font-size="11">V1 evaluates candidate items in arbitrary</text>
    <text x="20" y="142" class="text-muted" font-size="11">or insertion order without temporal weighting.</text>
    <text x="20" y="160" class="text-muted" font-size="11">Any single contradiction halts the pipeline</text>
    <text x="20" y="178" class="text-muted" font-size="11">and marks the claim permanently failed.</text>

    <rect x="20" y="195" width="290" height="30" rx="4" fill="rgba(248, 81, 73, 0.2)" />
    <text x="30" y="215" fill="#f85149" font-size="11" font-weight="bold">False Contradiction Rate in V1: 50.0%</text>
  </g>

  <!-- Bottom CTA -->
  <rect x="980" y="680" width="230" height="42" rx="6" fill="#1f6feb" />
  <text x="1095" y="706" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Next Step: Inspect Engineering Fix →</text>
</svg>
